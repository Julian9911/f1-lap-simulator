<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5363"/></marker></defs>
<rect width="1500" height="780" fill="#ffffff"/>
<text x="30" y="38" text-anchor="start" font-size="20" font-weight="700" fill="#1c2230">F1 Model Simulator - system architecture (top level)</text>
<text x="30" y="60" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6577">Closed-loop lap simulation. Area colors follow the block icons in the Simulink model.</text>
<rect x="30" y="88" width="380" height="130" rx="14" fill="#f4f5f7" fill-opacity="0.35" stroke="#8a93a3" stroke-width="2" stroke-dasharray="6 4"/>
