<text x="525" y="298" text-anchor="middle" font-size="11.5" fill="#2a303c">carX, carY, psi, xdot, Fz</text>
<text x="30" y="755" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6577" font-style="italic">Fz = vertical wheel loads, Fx = longitudinal tire forces, psi = heading, xdot = longitudinal speed, EngSpd = engine speed. The 'drive torque' path is drawn logically (it is routed inside the subsystems).</text>
