<rect x="60" y="310" width="320" height="80" rx="8" fill="#e8f3fc" stroke="#2b8fd6" stroke-width="1.6"/>
<text x="220.0" y="337.0" text-anchor="middle" font-size="14" font-weight="700" fill="#10283c">Reference Generator</text>
<text x="220.0" y="355.0" text-anchor="middle" font-size="12" fill="#10283c">f1_ref_pose</text>
<text x="220.0" y="373.0" text-anchor="middle" font-size="12" fill="#10283c">nearest line point + speed target</text>
