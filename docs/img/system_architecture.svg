<text x="850.0" y="459.0" text-anchor="middle" font-size="12" fill="#3a1d00">Mapped SI Engine, 8-speed gearbox, LSD</text>
<rect x="610" y="580" width="480" height="100" rx="8" fill="#fff6cf" stroke="#d4a900" stroke-width="1.6"/>
<text x="850.0" y="626.0" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3000">Tires</text>
